<!DOCTYPE html>
<html>
<head> 
    <title>School Management Project</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark">
{% include 'navbar.html' %}
<div class="container mt-5">
    <h2 class="text-success">Teacher Dashboard</h2>
    <p>Welcome, {{ request.user.username }}!</p>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-primary mb-4">
                <div class="card-header bg-primary text-white">Manage Classes</div>
                <div class="card-body text-center">
                    <p>Create and manage class records</p>
                    <a href="/classes/" class="btn btn-outline-primary">Go</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-warning mb-4">
                <div class="card-header bg-warning text-dark">Attendance</div>
                <div class="card-body text-center">
                    <p>Mark student attendance</p>
                    <a href="/attendance/" class="btn btn-outline-warning">Go</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
