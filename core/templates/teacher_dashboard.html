

{% include 'navbar.html' %}
<div class="container mt-5">
    <h2 class="text-success">Welcome, {{ teacher.user.username }}</h2>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card border-success mb-3">
                <div class="card-header bg-success text-white">Your Subject</div>
                <div class="card-body">
                    <p class="card-text">{{ teacher.subject }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-info mb-3">
                <div class="card-header bg-info text-white">Quick Links</div>
                <div class="card-body">
                    <a href="/classes/" class="btn btn-primary">View Classes</a>
                    <a href="/attendance/" class="btn btn-warning">Mark Attendance</a>
                </div>
            </div>
        </div>
    </div>
</div>
