{% include 'navbar.html' %}
{% if form.errors %}
<div class="alert alert-danger">
    {{ form.errors }}
</div>
{% endif %}

<div class="container mt-5">
    <h2 class="text-primary">Student Registration</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label>Email:</label>
{{ form.email }}

        <button type="submit" class="btn btn-success">Register</button>
    </form>
</div>
